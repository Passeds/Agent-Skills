common_mistakes:
  - id: CM_TECH_01
    type: "Tech"
    topic: "项目描述"
    mistake_pattern: "单纯堆砌使用过的技术栈，没有结合场景阐述难点，也没有体现出个人解决了什么业务痛点。"
    correction: "按照'项目背景 -> 核心挑战 -> 个人职责与技术方案 -> 最终收益'的闭环来层层递进表述。"
  - id: CM_HR_01
    type: "HR"
    topic: "自身最大缺点"
    mistake_pattern: "说自己太追求完美，或者工作太拼命导致休息时间少（看似自贬实则自夸）。"
    correction: "坦诚沟通一个真实的、正在努力改进且不影响岗位核心胜任力的缺点，重点阐述自己正在采取什么具体行动来改善它。"
  - id: CM_HR_02
    type: "HR"
    topic: "行为面试缺层"
    mistake_pattern: "缺失STAR法则的完整性。比如只有宏观的Action没有具体的Result支撑；或者通篇在讲团队做了什么(We)，抹弱了自己做了什么(I)。"
    correction: "用数据具象化成果（例如将接口延迟降低了20ms）。时刻强调'我'发挥的作用、踩坑和反省。"

model_answers:
  - topic: "虚拟内存"
    level: "优秀"
    points:
      - "【基本概念】虚拟内存在物理内存与进程间增加了一层映射，起到隔离进程安全与扩容作用。"
      - "【页表与MMU】内核通过页表来维护虚拟地址到物理地址转换，硬件通过MMU及加速组件TLB进行高频寻址。"
      - "【缺页中断】访问受保护或未载入地址时，OS触发Page Fault，将阻塞进程，去磁盘Swap分区交换数据入内存。"
      - "【页面置换】当物理内存吃紧时需执行换页算法，如LRU/LFU，进而可引申至自己写过/见过的Redis缓存驱逐机制。"
  - topic: "团队冲突与解决"
    level: "优秀"
    points:
      - "【Situation】交待项目时间紧迫的背景，及自己与测试/后端/算法同事在设计方案上的严重分歧。"
      - "【Task】目标是保证项目如期高质量交付，同时维护团队健康协作氛围，不能将业务分歧上升为人身攻击。"
      - "【Action】主动安排非正式沟通，并邀请第三方资深同事。要求抛开主观偏好，进行双方案压测/预研出客观数据对比。"
      - "【Result】最终基于事实数据拍板方案，不仅顺畅交付业务，还把该评估方式固化写进了团队技术规范维基文档里。"
