companies:
  字节跳动:
    tech_stack: Go, Python, C++, Redis生态, MySQL, 深入微服务架构
    culture: "字节范(ByteStyle) —— 始终创业、多元兼容、坦诚清晰、求真务实、敢为极致、共同成长"
    focus_areas: "海量并发系统的架构设计、算法底层基座考察、极高的代码稳定性要求。算法面难度极高"
    interview_style: "极度看重笔试手撕代码环节，通常要求Bug Free。业务问题喜欢抛出现网数亿日活场景压测你的极致思考和极限应对方案。"
  阿里巴巴:
    tech_stack: Java全家桶(JVM生态), Spring Boot, Spring Cloud, RocketMQ, Dubbo, 阿里云原生组件
    culture: "阿里的六脉神剑价值观，极度强调复盘文化和商业业务思考(不只是懂技术更要懂业务赋能)"
    focus_areas: "Java底层基石(JVM原理/垃圾回收/类加载, JUC并发编程)、框架源码深度剖析、中间件容灾和架构演变"
    interview_style: "围绕简历项目进行长达半小时以上的深挖追问链路，技术面会包含大量的高可用保障场景题以及很重的HR团队价值观对齐考查。"
  腾讯:
    tech_stack: C++, Go语言框架, TarsRPC, MySQL集群, Redis集群, Kafka流处理
    culture: "瑞雪文化，用户为本，科技向善"
    focus_areas: "计算机网络协议机制、操作系统内核机制极其深挖、海量及边缘数据流处理算法"
    interview_style: "以基础扎实度见长。网络(TCP滑动窗口/拥塞控制细节)与C++机制必问。喜欢用海量数据去重及智力统计题考验思维极值。"

universities:
  清华大学 (计算机系/软院):
    type: "院校机构 (保研/考研考核阶段)"
    focus_areas: "基础学科数学基本功、前沿领域(AI、计算机系统结构)学术潜力挖掘、论文泛读量"
    interview_style: "很少问及企业级的工程微服务架构等，更侧重用数学逻辑推导与硬核计算机组成探底。常设英文提问文献阅读理解环节和口语抗压测。"
  浙江大学 (计算机系/网安):
    type: "院校机构 (保研/考研考核阶段)"
    focus_areas: "前沿安全/AI大模型应用、底层系统原理、本科或竞赛的高质量科研产出"
    interview_style: "节奏快强度高，考察临场反应与解决科研卡点的逻辑闭环，要求能对所获奖项/项目的算法贡献度做出清晰定量的描述。"
