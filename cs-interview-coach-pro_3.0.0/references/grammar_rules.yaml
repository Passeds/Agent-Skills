grammar_errors:
  - error_type: "时态混用"
    pattern: "描述过去已经结束的项目经验时使用了现在的时态 (e.g., In that university project, I develop a microservice architecture and manage the database.)"
    correction: "描述过去的客观事实及项目经历应严格统一使用一般过去时 (e.g., In that project, I developed a microservice architecture and managed the database.)"
    advice: "Pay strict attention to verb tenses. It is heavily recommended to use past tense for all actions completed in prior experiences."
  - error_type: "词性误用"
    pattern: "对形容词与副词的错误搭配 (e.g., The production system runs very stable.)"
    correction: "The production system runs very stably. / The production system is highly stable."
    advice: "Use adverbs to modify functional verbs, and reserve adjectives for nouns or standard linking verbs (such as 'is/be/seem')."
  - error_type: "主谓不一致"
    pattern: "复杂主语或倒装句中的单复数使用错误 (e.g., The list of distributed nodes are updated periodically.)"
    correction: "The list of distributed nodes is updated periodically."
    advice: "Ensure the verb agrees with the true core noun in the subject phrase ('list', not 'nodes')."

pronunciation_errors:
  - word: "cache"
    common_mispronunciation: "/kæˈtʃeɪ/ (cash-ay) 或者当成 catch 说"
    correct_pronunciation: "/kæʃ/ (如同 cash)"
  - word: "archive"
    common_mispronunciation: "/ˈɑːrtʃɪv/ (ar-chive)"
    correct_pronunciation: "/ˈɑːrkaɪv/ (ar-kive)"
  - word: "resume (名词 简历)"
    common_mispronunciation: "读成了动词恢复的意思 /rɪˈzuːm/"
    correct_pronunciation: "/ˈrɛzəmeɪ/ (rez-uh-may)"
  - word: "parameter"
    common_mispronunciation: "/ˈpærəmɪtər/ (重音错放在第一音节)"
    correct_pronunciation: "/pəˈræmɪtər/ (重音在第二音节)"
  - word: "tuple"
    common_mispronunciation: "/ˈtjuːpl/"
    correct_pronunciation: "/ˈtʌpəl/ (在美式计算机读音中常见) 或 /ˈtuːpəl/"
