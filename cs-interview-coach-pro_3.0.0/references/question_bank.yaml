categories:
  tech:
    os:
      easy:
        - "进程和线程的区别是什么？"
      medium:
        - "请解释一下虚拟内存的原理和页面置换算法。"
      hard:
        - "详细讲解一下Epoll的底层实现原理以及水平触发和边缘触发的区别。"
    network:
      medium:
        - "TCP三次握手和四次挥手的过程，为什么握手是三次而挥手是四次？"
        - "HTTPS的工作原理以及TLS握手过程。"
    database:
      medium:
        - "MySQL的事务隔离级别有哪些？分别解决了什么问题？"
        - "索引的底层数据结构是什么？为什么选B+树？"
    distributed:
      hard:
        - "CAP定理与BASE理论，你在项目中是如何权衡一致性和可用性的？"
        - "Redis分布式锁在集群环境下的实现与缺陷（例如Redlock机制）。"
    system_design:
      hard:
        - "请设计一个高并发的抢红包系统，你会如何避免超卖问题？"
        - "请设计一个能够扛住双十一流量的短链接生成系统。"
  hr:
    behavioral:
      - "请分享一个你在项目中遇到最大困难的经历，你是如何解决的？（STAR）"
      - "在团队中如果和你意见相左的同事发生了冲突，你会如何处理？"
      - "你觉得你经历的最大抗压时刻是什么？请举例说明。"
    career_planning:
      - "你对未来三到五年的职业规划是什么？你想成为哪方面的专家？"
      - "你为什么选择我们公司，或者你为什么离职？"
  english:
    intro:
      - "Could you please give a brief introduction about yourself and your background?"
    professional:
      - "Can you describe the architecture of your most recent project?"
      - "What programming language are you most proficient in, and what are its advantages?"
    pressure:
      - "Why should we hire you instead of other candidates with more experience?"
  coding:
    algorithm:
      easy:
        - "两数之和 (Two Sum) - 要求 O(N) 复杂度"
      medium:
        - "无重复字符的最长子串 (Longest Substring Without Repeating Characters)"
      hard:
        - "K 个一组翻转链表 (Reverse Nodes in k-Group) - 要求 O(1) 额外空间"
    sql:
      medium:
        - "手写SQL：查询每个部门工资最高的前三名员工（考察窗口函数）"
    design_pattern:
      medium:
        - "请手写一个线程安全的单例模式（要求手写Double-check Locking）"
